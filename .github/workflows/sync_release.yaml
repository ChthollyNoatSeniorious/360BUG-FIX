name: Sync Release

permissions:
  contents: write

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要同步的精确版本标签（包括 beta）'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

concurrency:
  group: sync-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mirror-source:
    uses: ./.github/workflows/mirror.yaml
    secrets: inherit

  sync_release:
    needs: mirror-source
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.selected_release.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete binaries
        run: |
          rm -rf binaries
          

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Get exact release
        id: selected_release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v[0-9]+(\.[0-9]+)+-(stable|beta)$/.test(tag || '')) {
              throw new Error('An exact release tag is required.');
            }
            const {data} = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag
            });
            if (data.draft) throw new Error('Cannot sync a draft release.');
            const names = data.assets.map(asset => asset.name);
            if (!names.some(name => name.endsWith('.exe')) ||
                !names.some(name => name.endsWith('-mac'))) {
              throw new Error('Windows or macOS release asset is missing.');
            }
            core.setOutput('tag', data.tag_name);

      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.selected_release.outputs.tag }}
        run: |
          mkdir -p tmps
          gh release download "$RELEASE_TAG" --dir tmps --pattern '*.exe' --pattern '*-mac' --pattern '*.zip'

      - name: Create compressed archives
        run: |
          cd tmps
          
          # 获取当前日期
          current_date=$(date +"%Y-%m-%d")
          
          # 重命名pack版本的zip文件
          for zip_file in idv-login-*-Py*.zip; do
            if [ -f "$zip_file" ]; then
              cp "$zip_file" "问题十八专用！-${current_date}.zip"
              echo "Renamed $zip_file to 问题十八专用！-${current_date}.zip"
              break
            fi
          done
          
          # 压缩所有.exe文件（含说明文本）
          if ls *.exe 1> /dev/null 2>&1; then
            zip -r -j "最新版-${current_date}.zip" *.exe "../assets/工具不见了或者报毒点我解决.txt"
            echo "Created 最新版-${current_date}.zip"
          fi
          
          # 压缩所有mac文件
          if ls *mac 1> /dev/null 2>&1; then
            zip -r "MacOSVer（只在苹果电脑上使用，一般人不要下！）.zip" *mac
            echo "Created MacOSVer（只在苹果电脑上使用，一般人不要下！）.zip"
          fi
          
          ls -la *.zip

      - name: Upload to Quark Drive
        env:
          QUARK_COOKIES_B64: ${{ secrets.QUARK_COOKIES_B64 }}
          QUARK_PDIR_FID: ${{ secrets.QUARK_PDIR_FID }}
        run: |
          pip install -q requests==2.33.1
          
          cd tmps
          
          # 上传所有zip文件到夸克网盘
          for zip_file in *.zip; do
            if [ -f "$zip_file" ]; then
              echo "Uploading $zip_file to Quark Drive..."
              python ../tools/quark_upload.py "$zip_file"
            fi
          done

      - name: Release to Gitee
        id: release
        env:
          UPLOAD_PRE_URL: ${{ secrets.SECRET_UPLOAD_PRE_URL }}
          UPLOAD_URL: ${{ secrets.SECRET_UPLOAD_URL}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.selected_release.outputs.tag }}
          GITEE_TOKEN: ${{secrets.GITEE_TOKEN }}
          GITEE_ROPE: ${{ secrets.GITEE_ROPE }}
        run: |
          pip install -q requests_toolbelt==1.0.0
          python tools/release_upload.py tmp

  update-resources:
    needs: sync_release
    uses: ./.github/workflows/update_json.yaml
    with:
      release_tag: ${{ needs.sync_release.outputs.release_tag }}
    secrets: inherit
